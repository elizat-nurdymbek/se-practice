  week04_touching: allowed     # allowed | not-allowed | not-submitted

review_findings:
  - v1: the line start < b_end and end > b_start matches AC4, so can_book(660, 720, 540, False, [(600, 660)]) is True (checked by hand and by test_touching_end_is_allowed)
  - M1-M10: my suite caught all ten faulty versions, no fault survived
  - test_negative_start_is_rejected: two rules reject it (0 <= start and start > now), so 0 <= start cannot be tested alone (AC1, see 9.3)
  - Plan: no invented rule, but it says now is strictly within 0..1439 while the contract (AC1) says 0-1439 is valid, so the wording is wrong
